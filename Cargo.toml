[package]
name = "ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.log]
version = "0.4"

[dependencies.simple_logger]
version = "5.0"

[dependencies.rocket]
version = "0.5.1"
features = [
    "json",
    "tls"
]

[dependencies.nanoid]
version = "0.4.0"

[dependencies.tree_magic]
version = "0.2.3"

[dependencies.clap]
version = "4.5.60"
features = ["derive"]

[dev-dependencies.mockall]
version = "0.14"

[dev-dependencies.ctor]
version = "0.6.3"